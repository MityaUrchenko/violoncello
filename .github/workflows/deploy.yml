name: Deploy to server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "=== Проверка состояния ==="
            git fetch origin main

            CHANGES=$(git status --porcelain)
            HAD_CHANGES=0

            if [ -n "$CHANGES" ]; then
              echo "Найдены изменения, прячем в stash..."
              echo "$CHANGES"
              git stash push -u -m "auto-stash before deploy $(date +%Y-%m-%d_%H:%M)"
              HAD_CHANGES=1
            else
              echo "Рабочая директория чистая"
            fi

            echo "=== Выполняем reset ==="
            git reset --hard origin/main

            if [ "$HAD_CHANGES" = "1" ]; then
              echo "Возвращаем спрятанные файлы..."
              if git stash pop; then
                STATUS_MSG="✅ Деплой успешен, но на сервере есть новые/изменённые файлы (вернуты из stash)"
              else
                STATUS_MSG="⚠️ Деплой успешен, но при возврате stash возникли конфликты. Проверьте сервер!"
              fi
            else
              STATUS_MSG="✅ Деплой успешен. Сервер чистый."
            fi

            # Уведомление в Telegram
            MESSAGE="$STATUS_MSG

            Репозиторий: ${{ github.repository }}
            Коммит: ${{ github.sha }}
            Ветка: main"

            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="$MESSAGE" \
              -d parse_mode="Markdown"

            echo "=== Готово ==="