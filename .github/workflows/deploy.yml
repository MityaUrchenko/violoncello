name: Deploy to server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "=== Проверка состояния git ==="
            git fetch origin main

            # Смотрим, есть ли изменения (учитывает .gitignore)
            CHANGES=$(git status --porcelain)

            if [ -n "$CHANGES" ]; then
              echo "На сервере есть незакоммиченные изменения!"
              echo "$CHANGES"

              # --- Уведомление в Telegram ---
              MESSAGE="⚠️ Деплой остановлен!
            На сервере появились новые/изменённые файлы:

            \`\`\`
            $CHANGES
            \`\`\`

            Репозиторий: ${{ github.repository }}
            Коммит: ${{ github.sha }}"

              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                -d text="$MESSAGE" \
                -d parse_mode="Markdown"

              echo "Деплой прерван. Нужно разобраться с файлами на сервере."
              exit 1
            fi

            # Если изменений нет — деплоим
            echo "Рабочая директория чистая. Выполняем reset..."
            git reset --hard origin/main
            echo "=== Деплой успешно завершён ==="